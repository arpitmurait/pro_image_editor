name: example
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  pro_image_editor:
    path: ../

  intl: ^0.20.1
  
  bot_toast: ^4.1.0
  cupertino_icons: ^1.0.8
  file_picker: ^10.2.1
  gal: ^2.3.2
  google_fonts: ^6.3.0
  file_saver: ^0.3.1
  image_picker: ^1.1.2
  mime: ^2.0.0
  url_launcher: ^6.3.2
  get:
  dio:

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  import_sorter: ^4.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/demo.png
    - assets/demo.mp4
    - assets/frame.png
    - assets/frame1.png
    - assets/google_fonts/